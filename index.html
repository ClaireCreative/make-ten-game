<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Make Ten • Addition Game</title><style>:root{font-family:Arial,sans-serif;color:#17314d;background:#f3f8fb}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:850px;margin:auto;text-align:center}h1{margin:6px 0;color:#087baf}.sub{margin:0 0 20px;color:#51677b}.card{position:relative;overflow:hidden;background:white;border-radius:24px;padding:24px;box-shadow:0 10px 30px #153c6b18}.equation{font-size:clamp(52px,10vw,92px);font-weight:900;margin:10px}.yellow{color:#d5bd00}.blue{color:#087dcb}.bank{display:flex;justify-content:space-around;gap:12px;margin:20px 0}.tray{width:48%;min-height:125px;border-radius:18px;padding:14px}.ytray{background:#fff6b8}.btray{background:#ceeafa}.tray h2{font-size:18px;margin:0 0 12px}.tokens{display:grid;grid-template-columns:repeat(5,45px);justify-content:center;gap:8px}.token{height:45px;width:45px;border-radius:50%;border:3px solid #526578;background:#ffe127;box-shadow:inset 0 3px 3px #fff8,0 3px 2px #3453;cursor:grab;touch-action:none}.token.b{background:#1398e6}.token.used{opacity:.25;cursor:default}.frame{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:12px auto 20px;border:3px solid #516b79;border-radius:12px;overflow:hidden;background:#fff}.cell{aspect-ratio:1.15;border:1px solid #94abb8;display:grid;place-items:center;cursor:pointer}.cell.over{background:#d9f6df}.cell .token{height:min(8vw,52px);width:min(8vw,52px);cursor:pointer}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}button.action{border:0;border-radius:12px;background:#087dcb;color:white;padding:13px 20px;font-weight:bold;font-size:17px;cursor:pointer}button.secondary{background:#e3eef5;color:#184663}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:14px auto}.choice{background:#eef7fc;border:2px solid #86b9d5;border-radius:12px;min-height:51px;font-size:25px;font-weight:bold;color:#17314d;cursor:pointer}.choice.selected{background:#087dcb;color:white;border-color:#045786;transform:scale(1.06)}.feedback{min-height:34px;font-size:20px;font-weight:bold;margin:17px 0 0}.success{color:#07884b}.celebration{position:fixed;inset:0;z-index:9999;pointer-events:none;display:none;overflow:hidden;text-align:center}.celebration.show{display:block}.celebration-message{position:absolute;top:36%;left:50%;z-index:2;display:block;white-space:nowrap;padding:20px 36px;border-radius:24px;background:#ffffffef;color:#087b55;font-size:clamp(44px,11vw,100px);font-weight:900;box-shadow:0 12px 35px #1236;animation:bigPop 1.1s cubic-bezier(.2,1.4,.4,1) both}.confetti{position:absolute;top:-25px;width:11px;height:21px;border-radius:2px;animation:fall var(--duration) ease-in forwards;animation-delay:var(--delay);left:var(--left);background:var(--color);transform:rotate(var(--rotation))}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(1080deg);opacity:0}}@keyframes bigPop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}55%{transform:translate(-50%,-50%) scale(1.22) rotate(3deg);opacity:1}80%{transform:translate(-50%,-50%) scale(.94)}100%{transform:translate(-50%,-50%) scale(1)}}@media(prefers-reduced-motion:reduce){.confetti,.celebration-message{animation:none}.confetti{display:none}}.error{color:#ba4d21}.progress{color:#51677b;font-weight:bold}@media(max-width:520px){.tokens{grid-template-columns:repeat(5,35px);gap:5px}body{padding:10px}.card{padding:14px}.token{height:35px;width:35px}.tray{padding:8px}.cell .token{height:34px;width:34px}}</style><main><h1>Make Ten Addition</h1><p class="sub">Each color has 10 counters. Tap a counter, then tap a square. You can also drag counters into the ten-frame.</p><div class="card"><div class="celebration" id="celebration" role="status" aria-live="polite"><div class="celebration-message" id="celebrationText"></div><div id="confettiLayer"></div></div><div class="progress" id="progress"></div><div class="equation"><span class="yellow" id="first">3</span> + <span class="blue" id="second">4</span> = <span id="result">?</span></div><div class="bank"><div class="tray ytray"><h2>🟡 Yellow counters</h2><div class="tokens" id="yellowBank"></div></div><div class="tray btray"><h2>🔵 Blue counters</h2><div class="tokens" id="blueBank"></div></div></div><div class="frame" id="frame" aria-label="Ten-frame"></div><div><strong>Choose the total:</strong><div class="choices" id="choices" role="group" aria-label="Choose the total from 1 to 10"></div></div><div class="controls"><button class="action" id="check">Check answer</button><button class="action secondary" id="clear">Clear frame</button><button class="action secondary" id="next">New problem</button></div><p class="feedback" id="feedback" role="status"></p></div></main><script>const $=id=>document.getElementById(id);let a=0,b=0,placed=Array(10).fill(null),selected=null,round=1,score=0,solved=false,answer=null,lastCheer=-1;const cheers=['Good Job!','Awesome!','You Did It!','Way to Go!','Great Work!','Fantastic!'];function randomProblem(){let pairs=[];for(let x=1;x<=9;x++)for(let y=1;y<=10-x;y++)pairs.push([x,y]);let previous=`${a}+${b}`;try{if(!a)previous=localStorage.getItem('make-ten-last-problem')||''}catch(e){}let options=pairs.filter(([x,y])=>`${x}+${y}`!==previous);[a,b]=options[Math.floor(Math.random()*options.length)];try{localStorage.setItem('make-ten-last-problem',`${a}+${b}`)}catch(e){}}function draw(){ $('first').textContent=a;$('second').textContent=b;$('result').textContent=solved?a+b:'?';$('progress').textContent=`Round ${round} · Correct: ${score}`;document.querySelectorAll('.choice').forEach(x=>{let chosen=Number(x.textContent)===answer;x.classList.toggle('selected',chosen);x.setAttribute('aria-pressed',String(chosen))});for(const [color,count,id] of [['y',10,'yellowBank'],['b',10,'blueBank']]){$(id).replaceChildren();for(let i=0;i<count;i++){let t=document.createElement('button');t.className='token '+(color==='b'?'b ':'')+(placed.filter(x=>x===color).length>i?'used':'');t.type='button';t.setAttribute('aria-label',color==='y'?'yellow counter':'blue counter');t.draggable=true;t.dataset.color=color;t.onclick=()=>{selected=color;document.querySelectorAll('.tray').forEach(x=>x.style.outline='');$(id).parentElement.style.outline='3px solid #204f73'};t.ondragstart=e=>{selected=color;e.dataTransfer.setData('text/plain',color)};$(id).append(t)}}$('frame').replaceChildren();placed.forEach((color,i)=>{let c=document.createElement('div');c.className='cell';c.setAttribute('aria-label',`Square ${i+1}, ${color?color==='y'?'yellow':'blue':'empty'}`);c.onclick=()=>{if(color){placed[i]=null;solved=false;hideCelebration();draw()}else if(selected){add(i,selected)}};c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();c.classList.remove('over');add(i,e.dataTransfer.getData('text/plain')||selected)};if(color){let t=document.createElement('span');t.className='token '+(color==='b'?'b':'');c.append(t)}$('frame').append(c)})}function add(i,color){if(!color||placed[i]||placed.filter(x=>x===color).length>=(color==='y'?a:b))return;placed[i]=color;solved=false;hideCelebration();$('feedback').textContent='';draw()}function celebrate(){let panel=$('celebration'),layer=$('confettiLayer');let cheer;do{cheer=Math.floor(Math.random()*cheers.length)}while(cheer===lastCheer);lastCheer=cheer;$('celebrationText').textContent=cheers[cheer]+' 🎉';layer.replaceChildren();let colors=['#ffda2e','#1599e4','#18b773','#ff6894','#8d65de'];for(let i=0;i<90;i++){let bit=document.createElement('span');bit.className='confetti';bit.style.setProperty('--left',`${(i*71)%101}%`);bit.style.setProperty('--color',colors[i%colors.length]);bit.style.setProperty('--duration',`${2.5+(i%8)*.22}s`);bit.style.setProperty('--delay',`${(i%11)*.09}s`);bit.style.setProperty('--drift',`${(i%2?1:-1)*(15+(i%6)*12)}px`);bit.style.setProperty('--rotation',`${i*49}deg`);layer.append(bit)}panel.classList.remove('show');void panel.offsetWidth;panel.classList.add('show')}function hideCelebration(){$('celebration').classList.remove('show');$('confettiLayer').replaceChildren()}function check(){let y=placed.filter(x=>x==='y').length,bl=placed.filter(x=>x==='b').length,n=answer;let f=$('feedback');if(y!==a||bl!==b){f.textContent=`Put all ${a} yellow and ${b} blue counters in the frame first.`;f.className='feedback error'}else if(answer===null||n!==a+b){f.textContent='Count the counters and try again!';f.className='feedback error'}else{if(!solved){score++;celebrate()}solved=true;f.textContent='';f.className='feedback';draw()}}$('check').onclick=check;for(let i=1;i<=10;i++){let button=document.createElement('button');button.className='choice';button.type='button';button.textContent=i;button.onclick=()=>{answer=i;draw()};$('choices').append(button)}$('clear').onclick=()=>{hideCelebration();placed.fill(null);solved=false;answer=null;$('feedback').textContent='';draw()};$('next').onclick=()=>{hideCelebration();randomProblem();round++;placed.fill(null);selected=null;solved=false;answer=null;$('feedback').textContent='';document.querySelectorAll('.tray').forEach(x=>x.style.outline='');draw()};randomProblem();draw();</script></html>
